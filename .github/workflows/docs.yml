name: Build FruitCropXL Documentation

on:
  push:
    branches:
      - main
    paths:
      - "Scripts/**"
      - "Model_documents/FruitCropXL_doc_bash/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Doxygen and Graphviz
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get -yq update
          sudo apt-get -yq install doxygen graphviz

      - name: Build documentation
        run: bash Model_documents/FruitCropXL_doc_bash/module_replace.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: Model_documents/FruitCropXL_doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
